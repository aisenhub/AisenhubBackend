name: AisenHub Platform Local Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Enable pinned pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Local platform gate
        run: pnpm platform:verify

      - name: Scan committed files for secrets
        run: pnpm secrets:check

      - name: Check dependency and application boundaries
        run: pnpm boundaries:check

      - name: Upload safe test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
